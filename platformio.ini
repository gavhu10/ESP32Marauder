[platformio]
src_dir = ./esp32_marauder

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
    marian-craciunescu/ESP32Ping @ 1.7
    ESP32Async/AsyncTCP @ 3.4.8
    stevemarple/MicroNMEA @ 2.0.6
    ESP32Async/ESPAsyncWebServer @ 3.8.1
    bodmer/TFT_eSPI @ 2.5.34
    paulstoffregen/XPT2046_Touchscreen
    lvgl/lv_arduino @ 3.0.1
    bodmer/JPEGDecoder @ 1.8.1
    adafruit/Adafruit NeoPixel @ 1.12.0
    bblanchon/ArduinoJson @ 6.18.5
    ivanseidel/LinkedList
    plerup/EspSoftwareSerial @ 8.1.0
    adafruit/Adafruit BusIO @ 1.15.0
    adafruit/Adafruit MAX1704X @ 1.0.2
    adafruit/Adafruit TCA8418
; warnings are disabled becuse their are so many 
build_flags = 
    -Wl,--allow-multiple-definition
    -w

[env:m5cardputer]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_mode = dio
build_flags = ${env.build_flags} -D MARAUDER_CARDPUTER -D ARDUINO_USB_CDC_ON_BOOT=1 -include User_Setup_marauder_m5cardputer.h
lib_deps = ${env.lib_deps}
    h2zero/NimBLE-Arduino @ 1.3.8

[env:m5cardputer_adv]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
build_flags = ${env.build_flags} -D MARAUDER_CARDPUTER_ADV -D ARDUINO_USB_CDC_ON_BOOT=1 -include User_Setup_marauder_m5cardputer_adv.h
lib_deps = ${env.lib_deps}
    h2zero/NimBLE-Arduino @ 1.3.8 


